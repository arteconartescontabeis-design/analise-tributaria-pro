               caminho: TABELAS.calculos + '?on_conflict=escritorio_id,empresa_id,request_id',
               idempotente: true,
               corpo: [{
                 escritorio_id: meta.escritorio_id, empresa_id: meta.empresa_id || null,
                 imovel_id: meta.imovel_id || null, cnpj: meta.cnpj || null,
                 request_id: meta.request_id, correlation_id: meta.correlation_id || null,
                 calculado_por: meta.usuario_id || null,
                 entrada: entrada, resultado: snap.corpo.resultado,
                 motor_versao: M.MOTOR_IMOB_VERSAO, engine_build_id: meta.engine_build_id || null,
                 database_schema_version: meta.schema || 'imob-v3',
                 calculation_contract_version: M.CONTRATO_VERSAO,
                 ruleset_versao: M.RULESET_VERSAO,
                 regras_aplicadas: resultado.regras_aplicadas || [],
                 aliquotas: ctxCalc.aliquotas, nivel_confianca: aud.nivel_confianca,
                 lacre_imob: M.LACRE_IMOB_HASH, hash_snapshot: snap.hash_snapshot
               }],
               snapshot: snap, auditoria: aud,
               nota_conflito: 'Reenvio com a mesma chave não duplica: o on_conflict devolve a linha já gravada.' };
    },

    /* ---- índice de atualização ---- */
    salvarIndice: function (ix, ctx) {
      var e = precisaEscritorio(ctx); if (e) return e;
      if (!ix || !/^\d{4}-\d{2}$/.test(ix.competencia || ''))
        return erro('Competência do índice fora do formato AAAA-MM.', 'COMPETENCIA');
      if (!(ix.fator_desde_publicacao > 0))
        return erro('Fator de atualização ausente ou não positivo.', 'FATOR');

               caminho: TABELAS.indices + '?on_conflict=indice,competencia',
               corpo: [{ indice: ix.indice || 'IPCA', competencia: ix.competencia,
                         variacao_mes: ix.variacao_mes != null ? ix.variacao_mes : null,
                         numero_indice: ix.numero_indice != null ? ix.numero_indice : null,
                         fator_desde_publicacao: ix.fator_desde_publicacao,
                         fonte: ix.fonte || 'IBGE/SIDRA', criado_por: ctx.usuario_uuid || null }] };
    },

    /* ---- leituras ---- */
    listarImoveis: function (ctx) {
      var e = precisaEscritorio(ctx); if (e) return e;
      var q = TABELAS.imoveis + '?select=*&excluido_em=is.null&order=codigo_interno';
      if (ctx.empresa_id) q += '&empresa_id=eq.' + ctx.empresa_id;
      return { metodo: 'GET', tabela: TABELAS.imoveis, caminho: q };
    },
    listarCalculos: function (ctx) {
      var e = precisaEscritorio(ctx); if (e) return e;
      var q = TABELAS.calculos + '?select=id,calculado_em,request_id,nivel_confianca,hash_snapshot,'
            + 'motor_versao,ruleset_versao,resultado,entrada,empresa_id,imovel_id,calculado_por'
            + '&order=calculado_em.desc&limit=' + (ctx.limite || 50);
      if (ctx.empresa_id) q += '&empresa_id=eq.' + ctx.empresa_id;

      if (f.operacao && /^[a-z_]+$/.test(f.operacao)) q += '&entrada->>operacao=eq.' + f.operacao;
      if (f.de  && /^\d{4}-\d{2}-\d{2}$/.test(f.de))  q += '&calculado_em=gte.' + f.de + 'T00:00:00';
      if (f.ate && /^\d{4}-\d{2}-\d{2}$/.test(f.ate)) q += '&calculado_em=lte.' + f.ate + 'T23:59:59';

    movimentacoesDoImovel: function (imovelId) {
      if (!imovelId) return erro('Imóvel não identificado.', 'SEM_IMOVEL');

               caminho: TABELAS.redutor + '?select=*&imovel_id=eq.' + imovelId + '&order=criado_em' };
    },
    fontesDaRegra: function (regraId) {
      if (!regraId) return erro('Regra não identificada.', 'SEM_REGRA');
      return { metodo: 'GET', tabela: TABELAS.fontes,
               caminho: TABELAS.fontes + '?select=tipo_norma,numero,artigo,fonte_oficial,hash_fonte,'
                      + 'status_fonte,coletado_em&regra_uuid=not.is.null&order=hierarquia_normativa' };
    },

    /* ---- guarda contra escrita indevida ---- */
    verificarOperacao: function (req) {
      if (!req || req.erro) return req || erro('Requisição vazia.');
      if (SO_INSERT.indexOf(req.tabela) >= 0 && req.metodo !== 'POST' && req.metodo !== 'GET')
        return erro('A tabela ' + req.tabela + ' é imutável: só INSERT e leitura. '

      return req;
    }
  };

  /* =========================================================================
     imobDB — execução sobre o supa() do app
     ========================================================================= */
  function executar(req) {
    var r = imobRepo.verificarOperacao(req);
    if (r.erro) return Promise.reject(r);
    if (typeof raiz.supa !== 'function')
      return Promise.reject(erro('supa() do Análise Tributária Pro não encontrado — '
        + 'a persistência do módulo usa a mesma camada do resto do app.', 'SEM_SUPA'));
    // CORREÇÃO 1.0.1 — o contrato real do app é supa(METODO, tabela, opts), e
    // esta camada chamava supa(caminho, {method}). Medido: o app recebia a
    // query string inteira no lugar do método e a requisição morria antes de
    // sair. NENHUMA gravação do módulo funcionava. Defeito de contrato meu:
    // escrevi a camada sem o index à mão para conferir.
    // O `caminho` já traz a query, e o supa() do app o concatena na URL.
    var opts = {};
    if (r.corpo !== undefined) opts.body = r.corpo;
    if (r.retorna) opts.returning = true;          // o app usa `returning`, não `retorna`
    return Promise.resolve(raiz.supa(r.metodo, r.caminho, opts));
  }

  var imobDB = {
    VERSAO: PERSIST_VERSAO, TABELAS: TABELAS,
    salvarImovel: function (im, ctx) { return executar(imobRepo.salvarImovel(im, ctx)); },
    exercerOpcao258: function (id, esc, just, ctx) { return executar(imobRepo.exercerOpcao258(id, esc, just, ctx)); },
    movimentarRedutor: function (mov, ctx) { return executar(imobRepo.movimentarRedutor(mov, ctx)); },
    salvarIndice: function (ix, ctx) { return executar(imobRepo.salvarIndice(ix, ctx)); },
    listarImoveis: function (ctx) { return executar(imobRepo.listarImoveis(ctx)); },
    listarCalculos: function (ctx) { return executar(imobRepo.listarCalculos(ctx)); },
    movimentacoesDoImovel: function (id) { return executar(imobRepo.movimentacoesDoImovel(id)); },
    finalizarCalculo: function (e, res, ctxCalc, meta) {
      var req = imobRepo.finalizarCalculo(e, res, ctxCalc, meta);
      if (req.erro) return Promise.reject(req);
      return executar(req).then(function (dados) {
        return { gravado: true, hash_snapshot: req.snapshot.hash_snapshot,
                 nivel_confianca: req.auditoria.nivel_confianca, retorno: dados };
      });
    }

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  raiz.imobRepo = imobRepo; raiz.imobDB = imobDB;

<script>/* parecerImobIA.js */
/* ===========================================================================
   PARECER IMOBILIÁRIO COM IA — Análise Tributária Pro
   parecerImobIA.js · v1.0.0
   ---------------------------------------------------------------------------
   Usa a Edge Function PRÓPRIA do módulo (gerar-parecer-imobiliario), que tem
   renovação de token, repetição única em 401 e limite de 150 s.

   O que muda em relação ao parecer da Reforma: aqui a IA recebe um PACOTE com
   os valores JÁ CALCULADOS e a resposta passa OBRIGATORIAMENTE pela guarda
   anti-alucinação antes de chegar à tela. Texto reprovado NÃO é exibido — o
   módulo cai na memória determinística e diz por quê.

   Três camadas, de novo por testabilidade:
     montarPayloadIA   — puro: monta o corpo enviado à função
     interpretarResposta — puro: valida o que voltou, bloco a bloco
     gerarParecerImob  — executa, com uma segunda tentativa levando os
                         problemas encontrados como correção
   =========================================================================== */
(function (raiz) {
  'use strict';

  var PARECER_IA_VERSAO = '1.1.0';

  // A function do módulo, separada da do Análise Tributário Pro. Trocar aqui é
  // a ÚNICA razão pela qual eu havia proposto encostar na function do outro
  // aplicativo — o que contrariava a separação. Corrigido na 1.1.0.
  var FUNCTION_NOME = 'gerar-parecer-imobiliario';
  var M = raiz.MotorImob || (typeof require !== 'undefined' ? require('./motorImob.js') : null);

  /* Blocos de texto que a função deve devolver, na ordem do parecer. */
  var BLOCOS_TEXTO = ['objetivo', 'operacao', 'regrasAplicadas', 'memoriaComentada',
                      'situacaoAtualEReforma', 'comparacoes', 'riscos', 'recomendacoes',
                      'conclusao', 'limitacoes'];

  /* -------------------------------------------------------------------------
     1. Payload
     ------------------------------------------------------------------------- */
  function montarPayloadIA(pacote, empresa, opts) {
    opts = opts || {};
    if (!pacote || !pacote.contrato_pacote)
      return { erro: 'Pacote do parecer ausente ou fora do contrato.', codigo: 'SEM_PACOTE' };
    if (!Array.isArray(pacote.numeros_autorizados) || !pacote.numeros_autorizados.length)
      return { erro: 'Pacote sem números autorizados — a guarda anti-alucinação ficaria sem referência.', codigo: 'SEM_NUMEROS' };

    return {
      modo: 'imobiliario',                   // ramo novo da Edge Function
      contrato: pacote.contrato_pacote,
      empresa: {
        nome: (empresa && empresa.nome) || '',
        cnpj: (empresa && empresa.cnpj) || '',
        regime: (empresa && empresa.regime) || '',
        ano: (empresa && empresa.ano) || null
      },
      pacote: pacote,
      blocos_esperados: BLOCOS_TEXTO,
      restricoes: {
        proibido_calcular: true,
        numeros_autorizados: pacote.numeros_autorizados,
        marcas_de_origem: M ? M.ORIGENS : [],
        conclusao_permitida: pacote.bloco_11_conclusao.permitida,
        nivel_confianca: pacote.auditoria.nivel_confianca
      },
      correcao_anterior: opts.correcao || null,   // 2ª tentativa: o que reprovou
      versoes: pacote.versoes
    };
  }

  /* -------------------------------------------------------------------------
     2. Interpretação e guarda
     ------------------------------------------------------------------------- */
  function interpretarResposta(data, pacote) {
    if (!data || !data.textos)
      return { aprovado: false, motivo: 'resposta_sem_textos',
               mensagem: 'A função respondeu sem o campo "textos".', blocos: {}, problemas: [] };
    if (!M)
      return { aprovado: false, motivo: 'sem_motor',
               mensagem: 'motorImob indisponível para validar a resposta.', blocos: {}, problemas: [] };

    var t = data.textos, blocos = {}, faltando = [], porBloco = [];
    BLOCOS_TEXTO.forEach(function (b) {
      var txt = typeof t[b] === 'string' ? t[b].trim() : '';
      if (!txt) { faltando.push(b); return; }
      blocos[b] = txt;
      var v = M.validarParecerIA(txt, pacote);
      if (!v.aprovado) porBloco.push({ bloco: b, problemas: v.problemas });
    });

    // O texto inteiro também é conferido junto: número inventado pode nascer da
    // costura entre blocos, não de um bloco isolado.
    var inteiro = M.validarParecerIA(BLOCOS_TEXTO.map(function (b) { return blocos[b] || ''; }).join('\n'), pacote);

    var aprovado = porBloco.length === 0 && inteiro.aprovado && faltando.length === 0;
    return {
      aprovado: aprovado,
      motivo: aprovado ? null : (faltando.length ? 'blocos_faltando' : 'guarda_reprovou'),
      blocos: blocos,
      blocos_faltando: faltando,
      problemas: porBloco,
      problemas_no_conjunto: inteiro.aprovado ? [] : inteiro.problemas,
      numeros_conferidos: inteiro.numeros_conferidos,
      frases_conclusivas: inteiro.frases_conclusivas,
      mensagem: aprovado
        ? 'Texto conferido contra o pacote: todos os números batem e as frases conclusivas declaram a origem.'
        : (faltando.length
            ? 'A função não devolveu: ' + faltando.join(', ') + '.'
            : 'O texto gerado não passou na guarda anti-alucinação e NÃO foi exibido.')
    };
  }

  /* Texto de correção enviado na segunda tentativa. */
  function textoCorrecao(res) {
    var l = [];
    if (res.blocos_faltando && res.blocos_faltando.length)
      l.push('Blocos ausentes na resposta anterior: ' + res.blocos_faltando.join(', ') + '. Devolva todos.');
    (res.problemas || []).forEach(function (p) {
      p.problemas.forEach(function (x) {
        if (x.tipo === 'numero_nao_autorizado')
          l.push('No bloco "' + p.bloco + '" apareceram números que NÃO estão em numeros_autorizados: '
                 + x.itens.join(', ') + '. Reescreva usando apenas os valores do pacote.');
        if (x.tipo === 'frase_conclusiva_sem_origem')
          l.push('No bloco "' + p.bloco + '" há frase conclusiva sem a marca de origem entre colchetes: "'
                 + x.itens[0] + '".');
        if (x.tipo === 'conclusao_definitiva_vedada')
          l.push('O bloco "' + p.bloco + '" apresentou conclusão definitiva, que está VEDADA neste cálculo.');
      });
    });
    return l.join(' ');
  }

  /* -------------------------------------------------------------------------
     3. Execução
     ------------------------------------------------------------------------- */
  function gerarParecerImob(pacote, empresa, opts) {
    opts = opts || {};
    var chamar = opts.supaFn || raiz.supaFn;
    if (typeof chamar !== 'function')
      return Promise.reject({ erro: 'supaFn() do Análise Tributária Pro não encontrado — '
        + 'o parecer imobiliário usa a mesma Edge Function do app.', codigo: 'SEM_SUPAFN' });

    var tentativas = 0, maximo = opts.maximo || 2, historico = [];

    function rodada(correcao) {
      tentativas++;
      var payload = montarPayloadIA(pacote, empresa, { correcao: correcao });
      if (payload.erro) return Promise.reject(payload);

      return Promise.resolve(chamar(FUNCTION_NOME, payload)).then(function (r) {
        if (r && r.ok === false) {
          if (r.status === 404)
            throw { erro: 'Edge Function "' + FUNCTION_NOME + '" não encontrada. Publique-a no '
                        + 'Supabase: ela é do módulo imobiliário e não substitui a do Tributário.',
                    codigo: 'SEM_FUNCTION' };
          throw { erro: 'Falha na function (' + r.status + ').', codigo: 'HTTP' };
        }
        return (r && typeof r.json === 'function') ? r.json() : r;
      }).then(function (data) {
        var res = interpretarResposta(data, pacote);
        historico.push({ tentativa: tentativas, aprovado: res.aprovado, motivo: res.motivo });
        if (res.aprovado) return { ok: true, tentativas: tentativas, historico: historico, resultado: res };
        if (tentativas < maximo) return rodada(textoCorrecao(res));
        return { ok: false, tentativas: tentativas, historico: historico, resultado: res,
                 orientacao: 'O texto foi descartado. A memória de cálculo determinística continua '
                           + 'válida e é o que deve ser usado no parecer — ela não depende da IA.' };
      });
    }
    return rodada(null);
  }

  var API = { PARECER_IA_VERSAO: PARECER_IA_VERSAO, BLOCOS_TEXTO: BLOCOS_TEXTO,
              montarPayloadIA: montarPayloadIA, interpretarResposta: interpretarResposta,
              textoCorrecao: textoCorrecao, gerarParecerImob: gerarParecerImob };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  raiz.ParecerImobIA = API;

<script>/* nucleoRastreio.js */
/* ===========================================================================
   NÚCLEO DE RASTREABILIDADE — Análise Tributária Pro (motor genérico)
   nucleoRastreio.js · v1.0.0 · melhorias 3 e 4
   ---------------------------------------------------------------------------
   Leva ao motor GENÉRICO (Simples, Lucro Presumido, Lucro Real, Reforma) o que
   o módulo imobiliário ganhou: fonte legal com hash, snapshot forense,
   auditoria com nível de confiança, guarda anti-alucinação no parecer e
   reprodutibilidade histórica.

   REGRA DE OURO, de novo: este arquivo NÃO CALCULA NADA e não altera uma linha
   do motor genérico. Ele OBSERVA o resultado que o motor produziu. O lacre
   5a5562df continua sendo do motor, e nada aqui o toca.

   POR QUE ISSO IMPORTA: na v7.36.3 a IA usou 309.333,79 na narrativa porque o
   payload mandava o valor errado. Com a lista de números autorizados extraída
   do RESULTADO do motor — e não do payload —, aquele texto teria sido barrado
   antes de chegar ao cliente.
   =========================================================================== */
(function (raiz) {
  'use strict';

  var RASTREIO_VERSAO = '1.0.0';
  var RULESET_GENERICO = 'atp-2026.08.21';

  /* =========================================================================
     1. EXTRAÇÃO DOS NÚMEROS AUTORIZADOS A PARTIR DO RESULTADO DO MOTOR
     -------------------------------------------------------------------------
     Percorre a árvore do resultado e recolhe todo número. É deliberadamente
     abrangente: melhor autorizar um número a mais do que barrar um verdadeiro.
     O que a guarda impede é a IA inventar número que o motor nunca produziu.
     ========================================================================= */
  function r2(x) {
    if (typeof x !== 'number' || !isFinite(x)) return 0;
    var s = x < 0 ? -1 : 1;
    return s * Math.round(Math.abs(x) * 100 + 1e-9) / 100;
  }
  function r4(x) {
    if (typeof x !== 'number' || !isFinite(x)) return 0;
    var s = x < 0 ? -1 : 1;
    return s * Math.round(Math.abs(x) * 10000 + 1e-9) / 10000;
  }

  function numerosDoResultado(obj, limite) {
    limite = limite || 5000;
    var vistos = [], fila = [obj], n = 0;
    while (fila.length && n < limite) {
      var v = fila.shift(); n++;
      if (typeof v === 'number' && isFinite(v)) {
        vistos.push(r2(v));
        if (r4(v) !== r2(v)) vistos.push(r4(v));
      } else if (v && typeof v === 'object') {
        for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) fila.push(v[k]);
      }
    }
    // números triviais entram sempre: percentuais e contagens pequenas aparecem
    // no texto sem virem do cálculo (ex.: "as 5 faixas", "os 12 meses")
    [0, 1, 2, 3, 4, 5, 6, 10, 12, 100].forEach(function (x) { vistos.push(x); });
    return vistos.filter(function (x, i, a) { return a.indexOf(x) === i; });
  }

  /* =========================================================================
     2. GUARDA ANTI-ALUCINAÇÃO PARA O PARECER DA REFORMA
     ========================================================================= */
  var TOLERANCIA_CENTAVOS = 0.02;   // divergência de arredondamento aceitável

  function validarTextoParecer(texto, autorizados, opts) {
    opts = opts || {};
    texto = String(texto || '');
    var achados = texto.match(/\d{1,3}(?:\.\d{3})*,\d{2,4}|\d+,\d{2,4}/g) || [];
    var naoAutorizados = [], proximos = [];

    achados.forEach(function (a) {
      var v = parseFloat(a.replace(/\./g, '').replace(',', '.'));
      if (!isFinite(v)) return;
      var exato = autorizados.some(function (x) { return Math.abs(x - v) < 0.0001; });
      if (exato) return;
      var perto = autorizados.filter(function (x) { return Math.abs(x - v) <= TOLERANCIA_CENTAVOS; });
      if (perto.length) {
        if (!proximos.some(function (p) { return p.citado === a; }))
          proximos.push({ citado: a, esperado: perto[0], diferenca: r2(Math.abs(perto[0] - v)) });
        return;
      }
      if (naoAutorizados.indexOf(a) < 0) naoAutorizados.push(a);
    });

    var problemas = [];
    if (naoAutorizados.length)
      problemas.push({ tipo: 'numero_nao_autorizado', gravidade: 'alta', itens: naoAutorizados,
        explicacao: 'Valores citados que o motor não produziu neste cálculo.' });
    if (proximos.length && opts.exigir_centavo_exato)
      problemas.push({ tipo: 'divergencia_de_centavos', gravidade: 'baixa', itens: proximos,
        explicacao: 'Diferenças dentro de dois centavos — provável arredondamento na redação.' });

    if (opts.conclusao_vedada &&
        /mais vantajos|melhor regime|recomenda-se optar|deve optar|certamente|garantidamente/i.test(texto))
      problemas.push({ tipo: 'conclusao_vedada', gravidade: 'alta',
        itens: ['O nível de confiança não permite conclusão definitiva.'] });

    if (opts.exigir_ressalva_aliquota && !/estimad|n[ãa]o vinculante|refer[êe]ncia/i.test(texto))
      problemas.push({ tipo: 'sem_ressalva_de_aliquota', gravidade: 'media',
        itens: ['A alíquota usada não é legal e o texto não ressalva isso.'] });

    return { aprovado: problemas.filter(function (p) { return p.gravidade !== 'baixa'; }).length === 0,
             problemas: problemas, numeros_conferidos: achados.length,
             numeros_proximos: proximos };
  }

  /* =========================================================================
     3. AUDITORIA DO CÁLCULO GENÉRICO
     -------------------------------------------------------------------------
     Observa o resultado e o contexto e diz o quanto se pode concluir dali.
     Não corrige, não recalcula: aponta.
     ========================================================================= */
  function auditarAnalise(dados, ctx) {
    dados = dados || {}; ctx = ctx || {};
    var A = [];
    function add(cod, sev, titulo, detalhe, fonte) {
      A.push({ codigo: cod, severidade: sev, titulo: titulo, detalhe: detalhe, fonte: fonte || null });
    }

    if (ctx.aliquota_classificacao && ctx.aliquota_classificacao !== 'LEGAL')
      add('R01', 'medio', 'Alíquota de referência não é legal',
        'Classificada como ' + ctx.aliquota_classificacao + '. A Resolução CGIBS nº 14/2026 traz estimativa não vinculante.',
        'Res. CGIBS 14/2026');
    if (dados.creditos_por_proxy === true)
      add('R02', 'alto', 'Crédito de IBS/CBS estimado por proxy',
        'O crédito foi calculado por aproximação de compras, não pelas notas. O comparativo entre regimes fica sensível a esse número.', null);
    if (dados.despesas_ignoradas > 0)
      add('R03', 'alto', 'Despesas fora da base de crédito',
        r2(dados.despesas_ignoradas) + ' de despesas não entraram no crédito — o cenário fora do Simples fica superestimado.', null);
    if (dados.iss_configurado === 0 && dados.receita_servicos > 0)
      add('R04', 'alto', 'ISS em 0% com receita de serviços',
        'ISS parametrizado em zero havendo receita de serviço favorece artificialmente Presumido e Real na comparação.', 'LC 116/2003');
    if (dados.margem_sublimite_pct != null && dados.margem_sublimite_pct < 5)
      add('R05', 'alto', 'Margem estreita no limite ou sublimite',
        'A projeção fica a ' + r4(dados.margem_sublimite_pct) + '% do limite — o cenário "permanecer no Simples" é frágil.',
        'LC 123/2006, art. 3º');
    if (dados.mes_ultrapassagem)
      add('R06', 'alto', 'Mês de ultrapassagem do sublimite projetado',
        'Em ' + dados.mes_ultrapassagem + ' a receita se parte entre a parcela dentro do sublimite e a excedente — regra ainda não modelada.',
        'Res. CGSN 140/2018');
    if (dados.lucro_real_simulado === true)
      add('R07', 'medio', 'Lucro Real por simulação indicativa',
        'O cenário de Lucro Real é indicativo e não substitui apuração completa.', null);
    if (dados.dados_atipicos && dados.dados_atipicos.length)
      add('R08', 'medio', 'Dados atípicos no período',
        dados.dados_atipicos.join('; '), null);
    if (dados.periodo_incompleto === true)
      add('R09', 'medio', 'Período incompleto',
        'A análise cobre parte do ano. Totais e projeções refletem o realizado, não valores anuais.', null);
    if (dados.fontes_sem_hash > 0)
      add('R10', 'medio', 'Regras sem fonte hasheada',
        dados.fontes_sem_hash + ' regra(s) aplicada(s) sem fonte legal com hash e URL oficial.', null);

    var peso = { impeditivo: 4, alto: 3, medio: 2, baixo: 1 };
    var pior = A.reduce(function (m, x) { return Math.max(m, peso[x.severidade] || 0); }, 0);
    var nivel = pior >= 3 ? 'BAIXA' : (pior >= 2 ? 'MEDIA' : 'ALTA');
    return {
      achados: A.sort(function (a, b) { return peso[b.severidade] - peso[a.severidade]; }),
      total: A.length, nivel_confianca: nivel,
      permite_conclusao_definitiva: nivel !== 'BAIXA',
      mensagem: nivel === 'ALTA' ? 'Dados completos e alíquotas legais.'
        : nivel === 'MEDIA' ? 'Há premissas declaradas. Cabe conclusão indicativa.'
        : 'Confiança BAIXA: o parecer não deve afirmar qual regime é mais vantajoso.'
    };
  }

  /* =========================================================================
     4. SNAPSHOT E REPRODUTIBILIDADE HISTÓRICA (melhoria 4)
     ========================================================================= */
  function canonico(o) {
    if (o === null || typeof o !== 'object') return JSON.stringify(o === undefined ? null : o);
    if (Array.isArray(o)) return '[' + o.map(canonico).join(',') + ']';
    return '{' + Object.keys(o).sort().map(function (k) {
      return JSON.stringify(k) + ':' + canonico(o[k]); }).join(',') + '}';
  }
  function hash128(str) {
    var out = '';
    for (var seed = 0; seed < 4; seed++) {
      var h = (0x811c9dc5 ^ (seed * 0x9e3779b9)) >>> 0;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      out += ('00000000' + h.toString(16)).slice(-8);
    }
    return out;
  }

  function snapshotAnalise(entrada, resultado, ctx, meta) {
    meta = meta || {};
    if (!meta.request_id) return { erro: 'request_id obrigatório.', codigo: 'SEM_REQUEST_ID' };
    var aud = auditarAnalise(meta.sinais || {}, ctx || {});
    var corpo = {
      entrada: entrada, resultado: resultado,
      contexto: { aliquotas: (ctx && ctx.aliquotas) || null,
                  aliquota_classificacao: (ctx && ctx.aliquota_classificacao) || null,
                  parametros: (ctx && ctx.parametros) || null },
      auditoria: { nivel_confianca: aud.nivel_confianca, achados: aud.achados },
      versoes: { app: meta.app_versao || null, lacre_motor: meta.lacre_motor || null,
                 ruleset: meta.ruleset || RULESET_GENERICO, rastreio: RASTREIO_VERSAO,
                 engine_build_id: meta.engine_build_id || null }
    };
    var can = canonico(corpo);
    return { request_id: meta.request_id, empresa_cnpj: meta.cnpj || null, ano: meta.ano || null,
             corpo: corpo, hash_snapshot: hash128(can), canonico_bytes: can.length,
             numeros_autorizados: numerosDoResultado(resultado),
             auditoria: aud,
             algoritmo_hash: 'FNV1a-128 (cliente); o SHA-256 autoritativo é o do banco' };
  }

  /* Distingue os três casos que importam numa refação de parecer. */
  function reprocessarAnalise(snapshot, resultadoAtual, meta) {
    meta = meta || {};
    if (!snapshot || !snapshot.corpo) return { erro: 'Snapshot inválido.' };
    var antes = snapshot.corpo.resultado, agora = resultadoAtual;
    var mesmoLacre = (meta.lacre_motor || null) === (snapshot.corpo.versoes.lacre_motor || null);
    var mesmoRuleset = (meta.ruleset || RULESET_GENERICO) === snapshot.corpo.versoes.ruleset;

    var difs = [];
    function comparar(a, b, caminho) {
      if (typeof a === 'number' && typeof b === 'number') {
        if (r2(a) !== r2(b)) difs.push({ campo: caminho, antes: r2(a), agora: r2(b), delta: r2(b - a) });
        return;
      }
      if (a && b && typeof a === 'object' && typeof b === 'object') {
        Object.keys(a).forEach(function (k) { if (k in b) comparar(a[k], b[k], caminho ? caminho + '.' + k : k); });
      }
    }
    comparar(antes, agora, '');

    var igual = difs.length === 0;
    var diagnostico, gravidade;
    if (igual) { diagnostico = 'Cálculo reproduzido de forma idêntica.'; gravidade = 'ok'; }
    else if (mesmoLacre && mesmoRuleset) {
      diagnostico = 'DIVERGÊNCIA COM O MESMO MOTOR E O MESMO RULESET. Isto indica defeito — '
                  + 'não publique nem reemita parecer até investigar.'; gravidade = 'critico';
    } else if (!mesmoLacre) {
      diagnostico = 'O motor mudou (lacre ' + snapshot.corpo.versoes.lacre_motor + ' → ' + meta.lacre_motor
                  + '). A diferença é esperada. Para reproduzir o parecer da época, use o motor da época; '
                  + 'para reemitir com a regra atual, informe o cliente do que mudou.'; gravidade = 'atencao';
    } else {
      diagnostico = 'O ruleset mudou (' + snapshot.corpo.versoes.ruleset + ' → ' + (meta.ruleset || RULESET_GENERICO)
                  + '). Diferença esperada.'; gravidade = 'atencao';
    }

    return { reproduzido: igual, gravidade: gravidade, diagnostico: diagnostico,
             mesmo_lacre: mesmoLacre, mesmo_ruleset: mesmoRuleset,
             divergencias: difs.sort(function (a, b) { return Math.abs(b.delta) - Math.abs(a.delta); }).slice(0, 30),
             total_divergencias: difs.length,
             lacre_original: snapshot.corpo.versoes.lacre_motor,
             lacre_atual: meta.lacre_motor || null,
             ruleset_original: snapshot.corpo.versoes.ruleset,
             ruleset_atual: meta.ruleset || RULESET_GENERICO,
             alerta_parecer_emitido: !igual && meta.parecer_emitido === true
               ? 'ATENÇÃO: já houve parecer emitido com o resultado anterior. Qualquer reemissão precisa '
               + 'declarar a alteração e a norma que a motivou.' : null };
  }

  var API = { RASTREIO_VERSAO: RASTREIO_VERSAO, RULESET_GENERICO: RULESET_GENERICO,
              numerosDoResultado: numerosDoResultado, validarTextoParecer: validarTextoParecer,
              auditarAnalise: auditarAnalise, snapshotAnalise: snapshotAnalise,
              reprocessarAnalise: reprocessarAnalise, canonico: canonico, hash128: hash128 };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  raiz.NucleoRastreio = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* imob_premissas.js */
/* ============================================================================
 * imob_premissas.js — PREMISSAS do cálculo: origem, status, edição controlada
 * e grau de certeza. v1.0.0 · módulo Análise Imobiliária Pro 1.3.0
 *
 * O motorImob (lacre c287341e) NÃO é tocado. Este arquivo só monta o `ctx`
 * que o motor recebe e registra, para cada premissa: o valor automático, o
 * valor editado (se houver), quem justificou e quando. O relatório mostra os
 * dois valores lado a lado.
 *
 * Funções PURAS (sem DOM, sem rede) — testadas em tests/run_imob_ui.js.
 * ==========================================================================*/
(function (raiz) {
  'use strict';

  var VERSAO = '1.0.0';

  /* Catálogo: cada premissa com valor automático, origem, data e status.
     status: 'ativa' (regra em vigor) | 'estimada' (alíquota de referência não
     vinculante) | 'pendente' (depende de regulamentação/índice futuro).      */
  var CATALOGO = {
    ibs_padrao:  { rotulo: 'Alíquota padrão do IBS (%)', valor: 18.70, unidade: '%', min: 0, max: 100,
      origem: 'Resolução CGIBS 14/2026 — alíquota de referência (estimativa não vinculante)',
      data: '29/07/2026', status: 'estimada',
      fundamento: 'LC 214/2025, art. 14 c/c Res. CGIBS 14/2026' },
    cbs_padrao:  { rotulo: 'Alíquota padrão da CBS (%)', valor: 9.21, unidade: '%', min: 0, max: 100,
      origem: 'Resolução CGIBS 14/2026 — alíquota de referência (estimativa não vinculante)',
      data: '29/07/2026', status: 'estimada',
      fundamento: 'LC 214/2025, art. 14 c/c Res. CGIBS 14/2026' },
    reducao_venda: { rotulo: 'Redução de alíquota — alienação e demais operações (%)', valor: 50, unidade: '%', min: 0, max: 100,
      origem: 'LC 214/2025, art. 261, caput; RIBS/RCBS art. 379, caput', data: '16/01/2025', status: 'ativa',
      fundamento: 'LC 214/2025, art. 261, caput' },
    reducao_locacao: { rotulo: 'Redução de alíquota — locação, cessão onerosa e arrendamento (%)', valor: 70, unidade: '%', min: 0, max: 100,
      origem: 'LC 214/2025, art. 261, parágrafo único; RIBS/RCBS art. 379, parágrafo único', data: '16/01/2025', status: 'ativa',
      fundamento: 'LC 214/2025, art. 261, parágrafo único' },
    fator_ate_2026: { rotulo: 'Fator de atualização até 31/12/2026', valor: 1.4523, unidade: 'x', min: 0.000001, max: 1000,
      origem: 'Índice informado pelo usuário (IPC/Fipe até 1979; IPCA de 1980 a 2026) — a tabela oficial ainda não foi publicada',
      data: '—', status: 'pendente', fundamento: 'RIBS/RCBS art. 375, §4º' },
    ipca_fator: { rotulo: 'Fator IPCA de atualização dos redutores sociais', valor: 1, unidade: 'x', min: 0.000001, max: 1000,
      origem: 'Sem atualização (fator 1) até a publicação do índice de 2027', data: '—', status: 'pendente',
      fundamento: 'LC 214/2025, art. 259, §3º; art. 260, §2º' },
    redutor_social_residencial_novo: { rotulo: 'Redutor social — imóvel residencial novo (R$)', valor: 100000, unidade: 'R$', min: 0, max: 1e12,
      origem: 'LC 214/2025, art. 259, I', data: '16/01/2025', status: 'ativa', fundamento: 'LC 214/2025, art. 259, I' },
    redutor_social_lote_residencial: { rotulo: 'Redutor social — lote residencial (R$)', valor: 30000, unidade: 'R$', min: 0, max: 1e12,
      origem: 'LC 214/2025, art. 259, II', data: '16/01/2025', status: 'ativa', fundamento: 'LC 214/2025, art. 259, II' },
    redutor_social_locacao_mes: { rotulo: 'Redutor social — locação residencial (R$/mês)', valor: 600, unidade: 'R$', min: 0, max: 1e9,
      origem: 'LC 214/2025, art. 260 (redação da LC 227/2026)', data: '2026', status: 'ativa', fundamento: 'LC 214/2025, art. 260' },
    limite_pf_locacao: { rotulo: 'Limite de receita de locação — pessoa física (R$/ano)', valor: 240000, unidade: 'R$', min: 0, max: 1e12,
      origem: 'LC 214/2025, art. 251, §1º, I', data: '16/01/2025', status: 'ativa', fundamento: 'LC 214/2025, art. 251, §1º' }
  };
  var CHAVES = Object.keys(CATALOGO);

  function r4(x) { return Math.round((+x + Number.EPSILON) * 10000) / 10000; }

  /* Estado das edições: { chave: { valor, justificativa, quando, por } } */
  function novoEstado() { return {}; }

  function validarEdicao(chave, valor, justificativa) {
    var c = CATALOGO[chave];
    if (!c) return { ok: false, msg: 'Premissa desconhecida: ' + chave + '.' };
    var v = typeof valor === 'string' ? parseFloat(String(valor).replace(',', '.')) : valor;
    if (typeof v !== 'number' || !isFinite(v)) return { ok: false, msg: 'Informe um número válido para "' + c.rotulo + '".' };
    if (v < 0) return { ok: false, msg: 'Valor negativo não é admitido em "' + c.rotulo + '".' };
    if (v < c.min) return { ok: false, msg: '"' + c.rotulo + '" não pode ser inferior a ' + c.min + '.' };
    if (v > c.max) return { ok: false, msg: '"' + c.rotulo + '" não pode exceder ' + c.max + (c.unidade === '%' ? '%' : '') + '.' };
    if (c.unidade === 'x' && v === 0) return { ok: false, msg: 'Fator de atualização igual a zero anularia a base — informe um fator positivo.' };
    if (!justificativa || !String(justificativa).trim() || String(justificativa).trim().length < 5)
      return { ok: false, msg: 'A alteração manual de "' + c.rotulo + '" exige justificativa (mínimo de 5 caracteres).' };
    return { ok: true, valor: v };
  }

  function editar(estado, chave, valor, justificativa, por) {
    var v = validarEdicao(chave, valor, justificativa);
    if (!v.ok) return v;
    if (v.valor === CATALOGO[chave].valor) {           // voltou ao padrão: não é edição
      delete estado[chave];
      return { ok: true, restaurada: true, valor: v.valor };
    }
    estado[chave] = { valor: v.valor, justificativa: String(justificativa).trim(),
                      quando: new Date().toISOString(), por: por || null };
    return { ok: true, valor: v.valor };
  }
  function restaurar(estado, chave) { delete estado[chave]; return estado; }
  function restaurarTodas(estado) { CHAVES.forEach(function (k) { delete estado[k]; }); return estado; }

  function valorVigente(estado, chave) {
    return estado && estado[chave] ? estado[chave].valor : CATALOGO[chave].valor;
  }

  /* Lista consolidada — é o que o relatório imprime. */
  function listar(estado) {
    return CHAVES.map(function (k) {
      var c = CATALOGO[k], e = estado && estado[k];
      return { chave: k, rotulo: c.rotulo, unidade: c.unidade, valor_automatico: c.valor,
               valor_vigente: e ? e.valor : c.valor, editada: !!e,
               justificativa: e ? e.justificativa : null, quando: e ? e.quando : null, por: e ? e.por : null,
               origem: c.origem, data_premissa: c.data, status: c.status, fundamento: c.fundamento };
    });
  }
  function alteradas(estado) { return listar(estado).filter(function (p) { return p.editada; }); }

  /* Monta o ctx do motor a partir das premissas vigentes.
     O motor aplica SEMPRE 50% (venda) e 70% (locação) sobre ctx.aliquotas.
     Quando o usuário edita o percentual de redução, a alíquota enviada ao
     motor é a EQUIVALENTE: padrão × (1 − red_manual) / (1 − red_motor), de
     modo que padrão_enviada × (1 − red_motor) = padrão × (1 − red_manual).
     A memória mostra as duas — original e editada — pela função `explicar`. */
  function montarCtx(estado, operacao, extras) {
    var st = estado || {};
    var ibs = valorVigente(st, 'ibs_padrao'), cbs = valorVigente(st, 'cbs_padrao');
    var ehLoc = operacao === 'locacao';
    var redMotor = ehLoc ? 70 : 50;
    var redManual = valorVigente(st, ehLoc ? 'reducao_locacao' : 'reducao_venda');
    var fatorEq = 1;
    if (redManual !== redMotor) fatorEq = (1 - redManual / 100) / (1 - redMotor / 100);
    var edit = alteradas(st);
    var classificacao = 'ESTIMADA';
    if (edit.some(function (p) { return ['ibs_padrao', 'cbs_padrao', 'reducao_venda', 'reducao_locacao'].indexOf(p.chave) >= 0; }))
      classificacao = 'SIMULACAO';
    var ctx = {
      aliquotas: { ibs: r4(ibs * fatorEq), cbs: r4(cbs * fatorEq), classificacao: classificacao,
                   fonte: classificacao === 'SIMULACAO' ? 'premissa editada manualmente pelo usuário'
                                                        : CATALOGO.ibs_padrao.origem },
      parametros: { redutor_social_residencial_novo: valorVigente(st, 'redutor_social_residencial_novo'),
                    redutor_social_lote_residencial: valorVigente(st, 'redutor_social_lote_residencial'),
                    redutor_social_locacao_mes: valorVigente(st, 'redutor_social_locacao_mes'),
                    limite_pf_locacao: valorVigente(st, 'limite_pf_locacao') },
      indices: { ipca_fator: valorVigente(st, 'ipca_fator'), competencia: '2026-01',
                 fator_ate_2026: valorVigente(st, 'fator_ate_2026') },
      premissas: { versao: VERSAO, editadas: edit.map(function (p) { return p.chave; }),
                   reducao_aplicada: redManual, reducao_do_motor: redMotor, fator_equivalencia: r4(fatorEq),
                   ibs_padrao_original: ibs, cbs_padrao_original: cbs }
    };
    if (extras) for (var k in extras) if (extras.hasOwnProperty(k)) ctx[k] = extras[k];
    return ctx;
  }

  /* Alíquotas para exibição, coerentes com o resultado do motor. */
  function explicar(estado, operacao) {
    var st = estado || {};
    var ehLoc = operacao === 'locacao';
    var ibs = valorVigente(st, 'ibs_padrao'), cbs = valorVigente(st, 'cbs_padrao');
    var red = valorVigente(st, ehLoc ? 'reducao_locacao' : 'reducao_venda');
    // mesma sequência de arredondamento do motor: r4(padrão × eq) × (1 − red_motor)
    var redMotor = ehLoc ? 70 : 50;
    var fatorEq = red === redMotor ? 1 : (1 - red / 100) / (1 - redMotor / 100);
    var ibsF = r4(r4(ibs * fatorEq) * (1 - redMotor / 100)), cbsF = r4(r4(cbs * fatorEq) * (1 - redMotor / 100));
    return { ibs_padrao: ibs, cbs_padrao: cbs, reducao_pct: red,
             ibs_final: ibsF, cbs_final: cbsF,
             combinada_final: r4(ibsF + cbsF),
             editadas: alteradas(st).map(function (p) { return p.chave; }) };
  }

  /* Grau de certeza do resultado — aparece NO TOPO do resultado. */
  function grauCerteza(estado, res, ruleset) {
    var st = estado || {}, avisos = [], nivel = 'ALTA';
    var lista = listar(st);
    var estim = lista.filter(function (p) { return p.status === 'estimada'; });
    var pend  = lista.filter(function (p) { return p.status === 'pendente'; });
    var edit  = lista.filter(function (p) { return p.editada; });
    if (estim.length) { nivel = 'MEDIA';
      avisos.push({ tipo: 'estimada', msg: 'Simulação baseada em alíquotas estimadas e regras de transição. O resultado poderá ser atualizado conforme regulamentação posterior.' }); }
    if (pend.length) avisos.push({ tipo: 'pendente', msg: 'Premissas pendentes de regulamentação ou índice oficial: ' +
      pend.map(function (p) { return p.rotulo; }).join('; ') + '.' });
    if (edit.length) { nivel = 'BAIXA';
      avisos.push({ tipo: 'editada', msg: 'Há ' + edit.length + ' premissa(s) alterada(s) manualmente — o resultado é SIMULAÇÃO do usuário, não a aplicação automática da norma.' }); }
    if (res && res.confianca && res.confianca.nivel === 'BAIXA') nivel = 'BAIXA';
    if (res && res.confianca && res.confianca.nivel === 'MEDIA' && nivel === 'ALTA') nivel = 'MEDIA';
    return { nivel: nivel, avisos: avisos, ruleset: ruleset || null,
             premissas: lista, data_calculo: new Date().toISOString() };
  }

  var API = { VERSAO: VERSAO, CATALOGO: CATALOGO, CHAVES: CHAVES, novoEstado: novoEstado,
              validarEdicao: validarEdicao, editar: editar, restaurar: restaurar, restaurarTodas: restaurarTodas,
              valorVigente: valorVigente, listar: listar, alteradas: alteradas,
              montarCtx: montarCtx, explicar: explicar, grauCerteza: grauCerteza };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  raiz.ImobPremissas = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* imob_validacao.js */
/* ============================================================================
 * imob_validacao.js — validação ANTES do cálculo, por formulário.
 * v1.0.0 · módulo Análise Imobiliária Pro 1.3.0
 *
 * Cada função devolve { ok, erros:[{campo, msg}], avisos:[{campo,msg}] }.
 * `campo` é o id do input da tela, para o UI destacar o campo errado.
 * A mensagem diz O QUE está errado e COMO corrigir. Funções puras.
 * ==========================================================================*/
(function (raiz) {
  'use strict';
  var VERSAO = '1.1.0';   // 1.1.0: aceita valores formatados em R$

  function num(v) {
    if (v === '' || v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    var t = String(v).replace(/R\$|\s/g, '');
    if (t === '' || t === '-') return null;
    if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');   // pt-BR: 1.234,56
    var x = parseFloat(t); return isFinite(x) && /^-?\d*\.?\d+$/.test(t) ? x : NaN;
  }
  function dataValida(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var d = new Date(s + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === s;
  }
  function E(campo, msg) { return { campo: campo, msg: msg }; }
  function saida(erros, avisos) { return { ok: erros.length === 0, erros: erros, avisos: avisos || [] }; }

  function negativo(erros, campo, rotulo, v) {
    var x = num(v);
    if (x === null) return null;
    if (isNaN(x)) { erros.push(E(campo, rotulo + ': informe apenas números (use ponto ou vírgula para decimais).')); return NaN; }
    if (x < 0) erros.push(E(campo, rotulo + ' não pode ser negativo. Informe zero ou um valor positivo.'));
    return x;
  }
  function obrigatorio(erros, campo, rotulo, v, como) {
    var x = num(v);
    if (x === null || isNaN(x)) { erros.push(E(campo, rotulo + ' é obrigatório. ' + (como || 'Preencha o campo para calcular.'))); return null; }
    return x;
  }
  function data(erros, campo, rotulo, s, obrig) {
    if (!s) { if (obrig) erros.push(E(campo, rotulo + ' é obrigatória. Informe no formato dia/mês/ano.')); return null; }
    if (!dataValida(s)) { erros.push(E(campo, rotulo + ' inválida. Informe uma data real no formato dia/mês/ano.')); return null; }
    return s;
  }

  /* ---- Cadastro do imóvel (obrigatórios · opcionais · conforme operação) --- */
  var CAMPOS_IMOVEL = [
    { id: 'i-cod',   rotulo: 'Código interno',            classe: 'obrigatorio' },
    { id: 'i-emp',   rotulo: 'Empresa proprietária',      classe: 'opcional' },
    { id: 'i-mat',   rotulo: 'Matrícula',                 classe: 'opcional' },
    { id: 'i-end',   rotulo: 'Endereço',                  classe: 'opcional' },
    { id: 'i-mun',   rotulo: 'Município',                 classe: 'opcional' },
    { id: 'i-uf',    rotulo: 'UF',                        classe: 'opcional' },
    { id: 'i-tipo',  rotulo: 'Tipo do imóvel',            classe: 'obrigatorio' },
    { id: 'i-lote',  rotulo: 'Lote / unidade / bloco',    classe: 'opcional' },
    { id: 'i-atot',  rotulo: 'Área total (m²)',           classe: 'opcional' },
    { id: 'i-acon',  rotulo: 'Área construída (m²)',      classe: 'opcional' },
    { id: 'i-frac',  rotulo: 'Fração ideal',              classe: 'condicional', quando: 'permuta com unidades futuras' },
    { id: 'i-daq',   rotulo: 'Data de aquisição',         classe: 'condicional', quando: 'hipótese III do art. 375 (adquirido a partir de 2027)' },
    { id: 'i-dcon',  rotulo: 'Data de conclusão',         classe: 'condicional', quando: 'imóvel em construção' },
    { id: 'i-aq',    rotulo: 'Valor de aquisição',        classe: 'condicional', quando: 'hipóteses I e III do art. 375 e imóvel em construção' },
    { id: 'i-cst',   rotulo: 'Custos de construção até 31/12/2026', classe: 'condicional', quando: 'imóvel em construção (art. 375, II)' },
    { id: 'i-ref',   rotulo: 'Valor de referência',       classe: 'condicional', quando: 'opção do art. 375, I, "b"' },
    { id: 'i-reforig', rotulo: 'Origem do valor de referência', classe: 'condicional', quando: 'valor de referência informado' },
    { id: 'i-refdata', rotulo: 'Data do valor de referência', classe: 'condicional', quando: 'valor de referência informado' },
    { id: 'i-sit',   rotulo: 'Situação do imóvel',        classe: 'obrigatorio' },
    { id: 'i-doc',   rotulo: 'Documentos relacionados',   classe: 'opcional' },
    { id: 'i-obs',   rotulo: 'Observações técnicas',      classe: 'opcional' },
    { id: 'i-fat',   rotulo: 'Fator de atualização até 2026', classe: 'condicional', quando: 'hipóteses I e II do art. 375' }
  ];

  function validarImovel(f) {
    var erros = [], avisos = []; f = f || {};
    if (!f.codigo || !String(f.codigo).trim()) erros.push(E('i-cod', 'Código interno é obrigatório. Informe o identificador do imóvel no seu controle (ex.: AP-1201).'));
    if (!f.tipo) erros.push(E('i-tipo', 'Tipo do imóvel é obrigatório. Escolha residencial novo, lote residencial, comercial ou terreno.'));
    var sit = f.situacao || 'pronto';
    var aq = negativo(erros, 'i-aq', 'Valor de aquisição', f.valor_aquisicao);
    var ref = negativo(erros, 'i-ref', 'Valor de referência', f.valor_referencia);
    var cst = negativo(erros, 'i-cst', 'Custos de construção', f.custos);
    negativo(erros, 'i-atot', 'Área total', f.area_total);
    negativo(erros, 'i-acon', 'Área construída', f.area_construida);
    var fr = negativo(erros, 'i-frac', 'Fração ideal', f.fracao_ideal);
    if (typeof fr === 'number' && fr > 1) erros.push(E('i-frac', 'Fração ideal deve ficar entre 0 e 1 (ex.: 0,25 para 25%).'));
    var fat = num(f.fator);
    if (sit !== 'pos2027') {
      if (fat === null || isNaN(fat)) erros.push(E('i-fat', 'Informe o fator de atualização até 31/12/2026 (art. 375, §4º) — ex.: 1,4523.'));
      else if (fat <= 0) erros.push(E('i-fat', 'Fator de atualização não pode ser zero ou negativo. Informe um fator positivo (1 = sem atualização).'));
    }
    if (sit === 'pronto' || sit === 'pos2027') {
      if (aq === null || (typeof aq === 'number' && !(aq > 0))) erros.push(E('i-aq', 'Informe o valor de aquisição do imóvel para calcular a hipótese ' + (sit === 'pronto' ? 'I' : 'III') + ' do art. 375.'));
    }
    if (sit === 'pronto' && (ref === null || !(ref > 0)))
      avisos.push(E('i-ref', 'Sem valor de referência, a opção do art. 375, I, "b" fica indisponível — só a aquisição atualizada será apresentada. Informe o valor de referência do imóvel para calcular a hipótese prevista no art. 375.'));
    if (sit === 'construcao') {
      if (aq === null || !(aq > 0)) erros.push(E('i-aq', 'Imóvel em construção: informe o valor de aquisição do terreno (art. 375, II, "a").'));
      if (cst === null) erros.push(E('i-cst', 'Imóvel em construção: informe os custos de bens e serviços até 31/12/2026, ainda que zero (art. 375, II, "b").'));
    }
    if (sit === 'pos2027') {
      if (!data(erros, 'i-daq', 'Data de aquisição', f.data_aquisicao, true)) { /* já registrado */ }
      else if (f.data_aquisicao < '2027-01-01') erros.push(E('i-daq', 'Hipótese III do art. 375 exige aquisição a partir de 01/01/2027. Para aquisições anteriores use a situação "Pronto, do contribuinte".'));
    } else data(erros, 'i-daq', 'Data de aquisição', f.data_aquisicao, false);
    data(erros, 'i-dcon', 'Data de conclusão', f.data_conclusao, false);
    if (typeof ref === 'number' && ref > 0) {
      if (!f.ref_origem) avisos.push(E('i-reforig', 'Informe a origem do valor de referência (ex.: plataforma do CGIBS, laudo, ITBI) para a trilha de auditoria.'));
      data(erros, 'i-refdata', 'Data do valor de referência', f.ref_data, false);
    }
    if (f.uf && !/^[A-Z]{2}$/i.test(String(f.uf).trim())) erros.push(E('i-uf', 'UF deve ter 2 letras (ex.: SC).'));
    return saida(erros, avisos);
  }

  /* ---- Venda ------------------------------------------------------------- */
  function validarVenda(f) {
    var erros = [], avisos = []; f = f || {};
    var val = obrigatorio(erros, 'v-val', 'Valor da operação', f.valor, 'Informe o preço de venda do imóvel.');
    if (typeof val === 'number' && val <= 0) erros.push(E('v-val', 'Valor da operação deve ser maior que zero. Informe o preço de venda.'));
    negativo(erros, 'v-raj', 'Saldo do redutor de ajuste', f.redutor);
    negativo(erros, 'v-cre', 'Créditos de IBS/CBS', f.creditos);
    data(erros, 'v-data', 'Data do fato gerador', f.data, true);
    if (!f.tipo) erros.push(E('v-tipo', 'Escolha o tipo do imóvel — ele define o redutor social aplicável.'));
    if (f.pagamentos) {
      var partes = String(f.pagamentos).split(';').map(function (x) { return x.trim(); }).filter(Boolean);
      var soma = 0, ruim = false;
      partes.forEach(function (p) { var x = num(p); if (x === null || isNaN(x) || x < 0) ruim = true; else soma += x; });
      if (ruim) erros.push(E('v-pag', 'Pagamentos: use apenas números positivos separados por ponto e vírgula (ex.: 200000;100000;600000).'));
      else if (typeof val === 'number' && Math.abs(soma - val) > 0.02)
        avisos.push(E('v-pag', 'A soma dos pagamentos (' + soma.toFixed(2) + ') não fecha com o valor da operação (' + val.toFixed(2) + '). Ajuste as parcelas ou o valor.'));
    }
    return saida(erros, avisos);
  }

  /* ---- Locação ----------------------------------------------------------- */
  function validarLocacao(f) {
    var erros = [], avisos = []; f = f || {};
    var val = obrigatorio(erros, 'l-val', 'Valor mensal do aluguel', f.valor, 'Informe o aluguel mensal.');
    if (typeof val === 'number' && val <= 0) erros.push(E('l-val', 'Valor mensal do aluguel deve ser maior que zero.'));
    if (['residencial', 'nao_residencial'].indexOf(f.finalidade) < 0) erros.push(E('l-fim', 'Escolha a finalidade: residencial ou não residencial.'));
    var meses = num(f.meses);
    if (meses === null || isNaN(meses) || meses <= 0) erros.push(E('l-mes', 'Quantidade de meses deve ser um inteiro maior que zero.'));
    else if (meses !== Math.floor(meses)) erros.push(E('l-mes', 'Quantidade de meses deve ser um número inteiro (períodos parciais vão em "dias no mês").'));
    var prz = negativo(erros, 'l-prz', 'Prazo do contrato', f.prazo_dias);
    var dias = negativo(erros, 'l-dias', 'Dias no mês', f.dias_no_mes);
    if (typeof dias === 'number' && dias > 31) erros.push(E('l-dias', 'Dias no mês não pode exceder 31. Para vários meses use o campo "meses".'));
    var area = negativo(erros, 'l-area', 'Fração de área residencial', f.fracao_area);
    if (typeof area === 'number' && area > 1) erros.push(E('l-area', 'Fração de área residencial deve ficar entre 0 e 1 (ex.: 0,6 para 60%).'));
    negativo(erros, 'l-trib', 'Tributos e emolumentos', f.tributos);
    negativo(erros, 'l-cond', 'Condomínio', f.condominio);
    negativo(erros, 'l-foro', 'Foro / taxa de ocupação', f.foro);
    negativo(erros, 'l-cre', 'Créditos de IBS/CBS', f.creditos);

<script>/* imob_graficos.js */

/* ---------- carregamento e erros de aba ---------- */
function carregando(on){ var el = $('imob-carregando'); if (el) el.style.display = on ? '' : 'none'; }
function erroAba(msg){
  var el = $('imob-erro-aba'); if (!el) return;
  el.style.display = msg ? '' : 'none';
  el.innerHTML = msg ? '<div class="aviso err"><b>Erro na tela:</b> ' + esc(msg) + ' <span class="mini">Os dados digitados foram preservados; tente novamente ou troque de m&oacute;dulo.</span></div>' : '';
}
/* Executa uma ação de tela com indicador de carregamento e captura de erro. */
function acao(fn){
  carregando(true); erroAba(null);
  try { fn(); } catch (e) { console.error('[imob]', e); erroAba(e && e.message ? e.message : String(e)); }
  finally { carregando(false); }
}

/* ---------- validação ligada à tela ---------- */
function limparInvalidos(){ document.querySelectorAll('#page-imobiliaria .invalido').forEach(function(x){ x.classList.remove('invalido'); }); }
function mostrarValidacao(alvoId, v){
  limparInvalidos();
  var alvo = $(alvoId); if (!alvo) return v.ok;
  var h = '';
  if (v.erros.length) {
    h += '<div class="aviso err valid"><b>O c&aacute;lculo n&atilde;o foi realizado.</b> Corrija:<ul style="margin:6px 0 0 18px">' +
      v.erros.map(function(e){ var el = $(e.campo); if (el) el.classList.add('invalido'); return '<li>' + esc(e.msg) + '</li>'; }).join('') + '</ul></div>';
  }
  if (v.avisos.length) h += '<div class="aviso valid"><b>Aten&ccedil;&atilde;o:</b><ul style="margin:6px 0 0 18px">' + v.avisos.map(function(a){ return '<li>' + esc(a.msg) + '</li>'; }).join('') + '</ul></div>';
  alvo.innerHTML = h;
  return v.ok;
}

/* ---------- abas ---------- */
var ABAS = ['cadastro','memoria','imovel','inventario','venda','locacao','permuta','opcional','comparativo','pf','auditoria','historico','regras','premissas'];
function abrirAba(k){
  document.querySelectorAll('#imob-tabs .tab').forEach(function(x){ x.classList.toggle('on', x.dataset.t === k); });
  ABAS.forEach(function(a){ var p = $('t-'+a); if (p) p.style.display = (a === k) ? '' : 'none'; });
  acao(function(){
    if (k === 'regras') pintaRegras();
    if (k === 'auditoria') rodarAuditoria();
    if (k === 'historico') imobHistorico();
    if (k === 'inventario') { atualizarDatasInventario(); imobInventario(); }
    if (k === 'opcional') { if (!$('o-campos').innerHTML) pintaOpc(); pintaGuiaOpc(); }
    if (k === 'premissas') pintaPremissas();
    if (k === 'memoria') imobMemoriaAba();
    if (k === 'cadastro') imobCadastroTipo();
    if (k === 'opcional' || k === 'venda' || k === 'locacao' || k === 'permuta' || k === 'comparativo') ligarMoney();
  });
}
function ligarAbas(){
  document.querySelectorAll('#imob-tabs .tab').forEach(function(t){
    t.onclick = function(){ abrirAba(t.dataset.t); };
    t.tabIndex = 0; t.onkeydown = function(ev){ if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrirAba(t.dataset.t); } };
  });
}

      aliquota_efetiva_sobre_operacao: res.aliquota_efetiva_sobre_operacao, redutor_ajuste_usado: res.redutor_ajuste_usado,

function imobAvisoDB(msg, tipo){ return '<div class="' + (tipo === 'ok' ? 'info' : 'aviso') + '">' + msg + '</div>'; }
/* v1.4.1 — o contexto de banco é sempre lido do estado global da casca (APP) no momento do uso.
 * Antes ele era copiado UMA vez, em imobEntrar(); se o escritório chegasse depois (ou fosse
 * zerado no logout), a aba ficava com uma cópia velha. */
function escritorioValidoUI(v){ return (typeof v === 'number' && isFinite(v) && v > 0) || (typeof v === 'string' && v.trim() !== '' && v !== 'null' && v !== 'undefined'); }
function imobSincronizarContexto(){
  if (!window.APP) return IMOB_CTX_DB;
  IMOB_CTX_DB.escritorio_id = escritorioValidoUI(APP.escritorioId) ? APP.escritorioId : null;
  IMOB_CTX_DB.usuario_uuid  = (APP.user && APP.user.id) || null;
  IMOB_CTX_DB.usuario_id    = APP.usuarioId != null ? APP.usuarioId : null;
  IMOB_CTX_DB.empresa_id    = (window.EMP_GLOBAL && EMP_GLOBAL.id) || null;
  return IMOB_CTX_DB;
}
var MSG_SEM_VINCULO = 'Usuário autenticado, mas sem escritório vinculado. Procure o administrador.';
function imobSemBanco(){
  imobSincronizarContexto();
  if (IMOB_CTX_DB.escritorio_id) return null;
  var st = window.APP ? (APP.sessao || null) : 'fora';
  var msg = st === 'sem_vinculo' ? MSG_SEM_VINCULO
    : st === 'carregando' ? 'Aguarde: os dados do seu escritório ainda estão sendo carregados. Tente novamente em instantes.'
    : st === 'falha' ? 'Não foi possível carregar os dados do seu escritório. Verifique a conexão e tente novamente.'
    : st === 'fora' ? 'Fora do aplicativo não há sessão nem escritório: leitura e gravação ficam desativadas nesta prévia.'
    : 'Sessão sem escritório identificado. Saia e entre novamente; se persistir, procure o administrador.';
  return imobAvisoDB('<b>' + esc(msg) + '</b> Nada foi gravado.');
}
/* Toda operação de banco passa por aqui: espera o escritório da sessão (sessaoPronta() da casca)
 * e só então executa. Sem a casca (prévia fora do app) executa direto e o imobSemBanco() barra. */
function imobComSessao(fn, aoFalhar){
  if (typeof window.sessaoPronta !== 'function') { imobSincronizarContexto(); fn(); return; }
  carregando(true);
  window.sessaoPronta().then(function(){ carregando(false); imobSincronizarContexto(); fn(); },
    function(e){ carregando(false); imobSincronizarContexto();
      var m = imobSemBanco() || imobAvisoDB('<b>' + esc((e && e.erro) || 'Sessão indisponível.') + '</b> Nada foi gravado.');
      if (aoFalhar) aoFalhar(m); })
    .catch(function(e){ console.error('[imob]', e); erroAba(e && e.message ? e.message : String(e)); });
}

  function $(id) { return document.getElementById(id); }

  /* números já mostrados na tela → gráficos (ImobGraficos desenha; nada é recalculado) */
  function num(t) { t = String(t || '').replace(/[^\d,.-]/g, ''); if (!t) return 0; t = t.replace(/\./g, '').replace(',', '.'); var v = parseFloat(t); return isFinite(v) ? v : 0; }
  function graficosDaTela(ets, cards, total) {

    var comp = g.composicaoBase({ valor_operacao: v(/valor total|valor da opera|receita bruta/i), redutor_ajuste: v(/redutor de ajuste/i), redutor_social: v(/redutor social/i), deducoes: v(/dedu/i), base: v(/base de c\u00e1lculo/i) });

    var fo = $('fluxo-out'); if (fo) painel.appendChild(fo);

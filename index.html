<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Análise Tributária Pro mudou de endereço — Artecon</title>
<meta http-equiv="refresh" content="6; url=https://arteconartescontabeis-design.github.io/tributario-fiscal/analise-tributaria-pro/">
<link rel="canonical" href="https://arteconartescontabeis-design.github.io/tributario-fiscal/analise-tributaria-pro/">
<style>
  :root { --fundo:#f6f4ef; --cartao:#ffffff; --texto:#1f2a37; --suave:#5b6675; --marca:#1d4e89; --borda:#e3dfd6; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#14181d; --cartao:#1c222a; --texto:#e8ecf1; --suave:#a3adba; --marca:#7fb0ec; --borda:#2c343e; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--fundo); color:var(--texto); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:520px; width:100%; background:var(--cartao); border:1px solid var(--borda); border-radius:14px; padding:28px 24px; }
  h1 { font-size:1.3rem; margin:0 0 8px; }
  p { margin:0 0 14px; color:var(--suave); }
  a.botao { display:inline-block; background:var(--marca); color:#fff; text-decoration:none; padding:11px 18px; border-radius:10px; font-weight:600; }
  @media (prefers-color-scheme: dark) { a.botao { color:#0d1b2d; } }
  small { display:block; margin-top:16px; color:var(--suave); }
  small a { color:var(--marca); }
</style>
</head>
<body>
<main>
  <h1>Análise Tributária Pro mudou de endereço</h1>
  <p>O aplicativo agora fica no <b>Tributário e Fiscal</b>. Seus dados e o seu login continuam os mesmos.
     Você será levado ao endereço novo em alguns segundos.</p>
  <p><a class="botao" id="ir" href="https://arteconartescontabeis-design.github.io/tributario-fiscal/analise-tributaria-pro/">Abrir no endereço novo</a></p>
  <small>Atualize os seus favoritos — ou, melhor, entre sempre pelo <a href="https://arteconartescontabeis-design.github.io/portal/">Portal Artecon</a>.</small>
</main>
<script>
  (function () {
    var destino = "https://arteconartescontabeis-design.github.io/tributario-fiscal/analise-tributaria-pro/" + location.search + location.hash;
    document.getElementById("ir").href = destino;
    setTimeout(function () { location.replace(destino); }, 5000);
  })();
</script>
</body>
</html>

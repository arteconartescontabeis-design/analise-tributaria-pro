<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Análise Imobiliária Pro — Artecon</title>
<style>
:root{
  --primary:#1a5276; --primary-dark:#12405e; --primary-light:#2e86ab;
  --bg:#f4f6f8; --card:#ffffff; --border:#e3e8ee;
  --text:#1f2d3d; --muted:#6b7a8d;
  --ok:#1e8449; --ok-bg:#e8f6ee; --warn:#b9770e; --warn-bg:#fdf3e3;
  --err:#c0392b; --err-bg:#fdecea; --info-bg:#eaf2f8;
  --font:'DM Sans',sans-serif; --display:'Playfair Display',serif;
  --radius:12px; --shadow:0 1px 3px rgba(26,82,118,.08),0 4px 16px rgba(26,82,118,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
h1,h2,h3{font-family:var(--display);color:var(--primary);font-weight:600}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(46,134,171,.12)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}

/* ── AUTH ── */
#auth-screen{display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a5c 0%,#1a5276 50%,#2e86ab 100%)}
.auth-card{background:#fff;border-radius:16px;padding:38px 34px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.auth-card .logo{text-align:center;margin-bottom:6px;font-family:var(--display);font-size:26px;color:var(--primary)}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:14px}
.btn-primary{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;transition:background .15s}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{opacity:.55;cursor:default}
.auth-err{color:var(--err);font-size:13px;text-align:center;margin-top:10px;min-height:16px}

/* ── LAYOUT ── */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--primary);color:#fff;display:flex;flex-direction:column;z-index:20}
.sidebar .brand{padding:22px 20px 16px;font-family:var(--display);font-size:19px;line-height:1.25;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand small{display:block;font-family:var(--font);font-size:11px;opacity:.65;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.nav{flex:1;padding:14px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;color:rgba(255,255,255,.82);font-size:14px;margin-bottom:3px;cursor:pointer;transition:background .12s}
.nav-item:hover{background:rgba(255,255,255,.09)}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav-item .tag{margin-left:auto;font-size:9px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.sidebar .foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;opacity:.8}
.sidebar .foot .sair{cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block}
.main{margin-left:230px;padding:28px 34px;max-width:1250px}
.page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.page-title h1{font-size:24px}
.page-title .crumb{color:var(--muted);font-size:13px}

/* ── CARDS / TABELAS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.grid.c4{grid-template-columns:repeat(4,1fr)} .grid.c3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700;color:var(--primary)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--info-bg);color:var(--primary)}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;font-weight:600;transition:all .12s}
.btn:hover{border-color:var(--primary-light);color:var(--primary)}
.btn.solid{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.solid:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.progress{height:8px;background:var(--border);border-radius:20px;overflow:hidden;flex:1;min-width:160px}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));width:0%;transition:width .25s}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
.placeholder{padding:60px 20px;text-align:center;color:var(--muted)}
.placeholder h2{font-size:20px;margin-bottom:8px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--primary-dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:all .25s;z-index:99}
.toast.show{opacity:1;transform:none}
.an-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--border);padding-bottom:10px}
.an-tab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.an-tab.on{background:var(--info-bg);color:var(--primary)}
.gtable td{padding:3px 4px;border-bottom:1px solid #eef2f6}
.gtable th{position:sticky;top:0;background:#fff}
.gtable input{padding:5px 6px;font-size:12.5px;text-align:right;border-radius:6px;min-width:86px}
.gtable .rot{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;padding-right:10px}
.gtable .grupo td{padding-top:12px;font-family:var(--display);color:var(--primary);font-size:13.5px;border-bottom:none}
.melhor{outline:3px solid var(--ok);outline-offset:-3px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
.num{text-align:right;white-space:nowrap}
.rl-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
canvas{max-height:340px}
@media print{ .sidebar,.no-print,.nav,.toolbar,.tag{display:none!important} .main{margin-left:0!important;padding:0!important} .card{box-shadow:none!important;border:1px solid #ddd;page-break-inside:avoid} body{background:#fff!important} }
@media(max-width:960px){.sidebar{width:64px}.sidebar .brand,.nav-item span,.sidebar .foot{display:none}.main{margin-left:64px;padding:20px}}

/* ═══ v7: Parecer (páginas A4 com capa/timbrado) ═══ */
.pp-page{position:relative;background:#fff;border:1px solid var(--line,#dde1e8);border-radius:10px;margin:14px 0;overflow:hidden;min-height:280mm}
.pp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;z-index:0}
.pp-capa{min-height:280mm}
.pp-capa.pp-semarte{background:#0e2a4d}
.pp-capa-cliente{position:absolute;left:0;top:57%;max-width:46%;padding:7mm 9mm 7mm 12mm;color:#fff;z-index:2;background:rgba(11,31,58,.88);border-radius:0 10px 10px 0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pp-capa-lbl{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#d99a2b;margin-bottom:6px}
.pp-capa-nome{font-size:21px;font-weight:800;line-height:1.25;margin-bottom:4px}
.pp-capa-cnpj{font-size:12px;opacity:.9}
.pp-capa-data{font-size:11px;opacity:.75;margin-top:8px}
.pp-miolo{position:relative;z-index:2;padding:56mm 18mm 44mm 18mm}
.pp-sec{font-size:16px;color:#2b3240;border-bottom:2px solid #d99a2b;padding-bottom:5px;margin:20px 0 8px;font-family:var(--display)}
.pp-miolo .pp-sec:first-child{margin-top:0}
.pp-p{font-size:13px;line-height:1.65;text-align:justify;margin:8px 0}
.pp-enq{background:#fbf3e2;border-left:3px solid #d99a2b;border-radius:0 8px 8px 0;padding:10px 12px;font-size:12.5px;line-height:1.6;margin:10px 0}
.pp-enq-v{background:#f9ecee;border-left-color:#8c2f39}
.pp-ficha{background:#f2f5f8;border-left:3px solid #1a5276;border-radius:0 8px 8px 0;padding:8px 12px;font-size:11.5px;line-height:1.55;color:#2c3e50;margin:6px 0 10px}
.pp-alerta{background:#f9ecee;border-left:3px solid #8c2f39;border-radius:0 8px 8px 0;padding:10px 12px;font-size:12px;line-height:1.55;margin:10px 0}
.pp-timeline{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.pp-tl-item{flex:1;min-width:130px;background:var(--soft,#f5f6f9);border:1px solid var(--line,#dde1e8);border-radius:8px;padding:9px 10px;font-size:11px;display:flex;flex-direction:column;gap:2px}
.pp-tl-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-bottom:3px}
.pp-jornada{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;margin:12px 0}
.pp-jbox{border-radius:10px;padding:13px;color:#fff}
.pp-jet{font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-bottom:5px}
.pp-jbig{font-size:19px;font-weight:800}
.pp-jsm{font-size:11px;opacity:.9;margin-top:5px;line-height:1.45}
.pp-jseta{display:flex;align-items:center;justify-content:center;color:#6a7286;font-size:19px}
.pp-chartbox{border:1px solid var(--line,#dde1e8);border-radius:10px;padding:11px;margin:10px 0;background:#fff}
.pp-chartbox canvas{max-width:100%!important;height:auto!important}
.pp-ct{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6a7286;margin-bottom:6px}
.pp-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pp-tab{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.pp-tab th{background:#2b3240;color:#fff;padding:6px 7px;text-align:right;font-weight:600}
.pp-tab th:first-child{text-align:left;border-radius:6px 0 0 0}.pp-tab th:last-child{border-radius:0 6px 0 0}
.pp-tab td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--line,#dde1e8)}
.pp-tab td:first-child,.pp-tab td.rot{text-align:left;font-weight:600;color:#2b3240}
.pp-tab td:last-child{text-align:left}
.pp-tab-f td:last-child{text-align:left}.pp-tab td.num{text-align:right}
.pp-pill{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#0f7a5a;border-radius:14px;padding:2px 9px}
.pp-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.pp-card{border:1px solid var(--line,#dde1e8);border-radius:10px;padding:10px;background:var(--soft,#f5f6f9)}
.pp-card .t{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6a7286;margin-bottom:4px}
.pp-card .v{font-size:15px;font-weight:800;color:#8c2f39}
.pp-card .s{font-size:10px;color:#6a7286;margin-top:3px}
.pp-plano{margin:10px 0}
.pp-passo{display:flex;gap:12px;margin-bottom:10px;font-size:12.5px;line-height:1.5}
.pp-num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.pp-quando{font-size:9px;color:#6a7286;letter-spacing:.08em;text-transform:uppercase}
.pp-final{border-left:3px solid #0f7a5a;background:#e7f4ef;padding:11px 13px;font-size:13.5px;font-weight:600;color:#2b3240;margin:12px 0;border-radius:0 8px 8px 0}
.pp-assin{margin-top:22px;font-size:13px}
.pp-traco{width:62mm;border-top:1px solid #242b38;margin-bottom:5px}
.pp-notaia{margin-top:16px;font-size:10px;color:#8a93a6;border-top:1px dashed var(--line,#dde1e8);padding-top:8px}
@media print{
  @page{size:A4;margin:0}
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  body *{visibility:hidden}
  #rl-corpo, #rl-corpo *{visibility:visible}
  #rl-corpo{position:absolute;left:0;top:0;width:210mm}
  .pp-tools{display:none!important}
  .pp-page{border:none;border-radius:0;margin:0;width:210mm;height:296mm!important;max-height:296mm;page-break-after:always;box-shadow:none;overflow:hidden!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative}
  .pp-page:last-child{page-break-after:auto}
  .pp-bg{height:296mm;width:210mm}
  .pp-capa{height:296mm;min-height:296mm;overflow:hidden}
  .pp-miolo{padding:56mm 18mm 44mm 18mm!important}
  .pp-duo{grid-template-columns:1fr 1fr!important}
  .pp-jornada{grid-template-columns:1fr 34px 1fr!important}
  .pp-jseta{transform:none!important}
  .pp-chartbox{break-inside:avoid}
  .pp-chartbox canvas{max-width:100%!important;width:100%!important;height:auto!important}
  #pc-evo{height:70mm!important}
  #pc-pct{height:36mm!important}
  #pc-cen33{height:40mm!important}
  #pc-recms{height:55mm!important}
  #pc-delta{height:58mm!important}
  #pc-acum{height:42mm!important}
  #pc-das{width:auto!important;max-height:80mm!important}
  .pp-tab tr{break-inside:avoid}
  .pp-page, .pp-miolo{max-width:210mm}
  /* v7.18.0 · relatórios em cartões: A4 sem cortes */
  #rl-corpo>.card{width:210mm;max-width:210mm;box-sizing:border-box;margin:0;padding:8mm 10mm;border:none;border-radius:0;page-break-inside:avoid}
  #rl-corpo>.card[style*="page-break-before"]{page-break-before:always}
  #rl-corpo .card table{width:100%!important;font-size:8.5pt;border-collapse:collapse}
  #rl-corpo .card th,#rl-corpo .card td{padding:2px 4px;word-break:break-word}
  #rl-corpo .card div[style*="overflow"]{overflow:visible!important;max-height:none!important}
  #rl-corpo thead{display:table-header-group}
  #rl-corpo tr{page-break-inside:avoid}
  #rl-corpo .grid,#rl-corpo .stat{page-break-inside:avoid}
}
@media screen and (max-width:760px){ .pp-duo{grid-template-columns:1fr} .pp-jornada{grid-template-columns:1fr} .pp-jseta{transform:rotate(90deg)} .pp-miolo{padding:24mm 6mm 20mm 6mm} }


/* ═══ v7.2: pacote UX ═══ */
.rep12{border:1px solid var(--border,#e3e8ee);background:#fff;border-radius:6px;font-size:11px;line-height:1;padding:2px 5px;cursor:pointer;color:var(--muted,#6b7a8d);vertical-align:middle;margin-left:4px}
.rep12:hover{color:var(--primary,#1a5276);border-color:var(--primary,#1a5276)}
.gtable input:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--primary,#1a5276)!important;outline-offset:1px}
.pp-skel{position:relative;color:transparent!important;user-select:none}
.pp-skel *{color:transparent!important}
.pp-skel::after{content:'';position:absolute;inset:2px;border-radius:6px;background:linear-gradient(90deg,#eef1f5 25%,#f7f9fb 45%,#eef1f5 65%);background-size:200% 100%;animation:ppskel 1.2s linear infinite}
@keyframes ppskel{from{background-position:200% 0}to{background-position:-200% 0}}
@media print{ .rep12{display:none!important} }

</style>

<script>
/* ── casca copiada do Análise Tributária Pro ───────────────────────────── */
const SUPA_URL = 'https://kmdrqkiyhdmdtufrogke.supabase.co';

const SUPA_KEY = 'sb_publishable_4eHrESOoQYRC7bR9rYKGBg_If2lOjnE';

const SUPAFN_T = { ren: 10000, fn: 12000,
  porFn: { 'gerar-parecer': 150000, 'atualizar-classtrib': 90000 } };

const APP = { token:null, user:null, page:'dashboard', tokenExp:0, papel:null, escritorioId:null };

const $id = id => document.getElementById(id);

function sessaoGuardar(data){
  APP.token = data.access_token; APP.user = data.user || APP.user;
  APP.tokenExp = data.expires_at ? data.expires_at*1000                     // unix s → ms
               : Date.now() + ((+data.expires_in || 3600) * 1000);
  localStorage.setItem('atp_token', data.access_token);
  localStorage.setItem('atp_refresh', data.refresh_token);
}

async function supa(method, table, opts = {}) {
  const { body, params, returning=false, semPrefer=false } = opts;   // v7.41.1: RPC não leva Prefer de upsert
  const url = new URL(`${SUPA_URL}/rest/v1/${table}`);
  if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.append(k,v));
  if (APP.token) await garantirToken();                    // v7.17.1: renova o token vencido antes do PostgREST
  const headers = { 'apikey':SUPA_KEY, 'Content-Type':'application/json' };
  if (APP.token) headers['Authorization'] = `Bearer ${APP.token}`;
  if (returning) headers['Prefer'] = 'return=representation,resolution=merge-duplicates';
  else if (method==='POST' && !semPrefer) headers['Prefer'] = 'resolution=merge-duplicates';
  const res = await fetch(url, { method, headers, body: body?JSON.stringify(body):undefined });
  if (!res.ok) { const t = await res.text(); throw new Error(`${res.status}: ${t}`); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function supaFn(nome, payload){
  let __tmr;
  const ren = await Promise.race([ garantirToken().finally(()=>clearTimeout(__tmr)),
    new Promise(res => { __tmr = setTimeout(()=>res('__tempo__'), SUPAFN_T.ren); }) ]);
  if (ren === '__tempo__') throw new Error(`a renovação da sessão não respondeu em ${Math.round(SUPAFN_T.ren/1000)}s — verifique a internet e o Supabase (Auth).`);
  if (!ren) throw new Error('Sessão expirada — saia e entre novamente no app.');
  const limite = (SUPAFN_T.porFn && SUPAFN_T.porFn[nome]) || SUPAFN_T.fn;   // v7.33.1
  const chamar = async () => {
    const ab = new AbortController(); const tm = setTimeout(()=>ab.abort(), limite);
    try {
      return await fetch(`${SUPA_URL}/functions/v1/${nome}`, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'apikey': SUPA_KEY, 'Authorization':'Bearer '+APP.token },
        body: JSON.stringify(payload), signal: ab.signal });
    } catch(e){
      if (e && e.name === 'AbortError')
        throw new Error(`a função ${nome} não respondeu em ${Math.round(limite/1000)}s${limite>30000?' (limite já ampliado por ser uma função demorada)':''} — confira em Supabase → Edge Functions → ${nome} → Logs: se a chamada aparece lá, o problema é na execução (veja o erro no log); sem invocação registrada = problema no deploy/nome.`);
      throw new Error(`a chamada à função ${nome} foi bloqueada antes de chegar ao servidor (rede/CORS/preflight) — confira se a função existe com esse nome EXATO e se "Verify JWT" está DESLIGADO.`);
    } finally { clearTimeout(tm); }
  };
  let r = await chamar();
  if (r.status===401 && await garantirToken(true)) r = await chamar();
  return r;
}

async function garantirToken(forcar=false){
  if (!APP.token) return false;
  if (!forcar && APP.tokenExp && Date.now() < APP.tokenExp - 120000) return true;   // ainda vale ≥2 min: segue
  if (!SESS_RENOVANDO) SESS_RENOVANDO = tentarSessao().finally(()=>{ SESS_RENOVANDO = null; });
  return SESS_RENOVANDO;
}

async function tentarSessao() {
  const rt = localStorage.getItem('atp_refresh');
  if (!rt) return false;
  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: rt })
    });
    const data = await res.json();
    if (!res.ok) throw 0;
    sessaoGuardar(data);                                   // v7.17.1
    return true;
  } catch { localStorage.removeItem('atp_token'); localStorage.removeItem('atp_refresh'); return false; }
}

async function doLogin() {
  const email = $id('l-email').value.trim(), senha = $id('l-senha').value;
  const btn = $id('btn-login'); btn.disabled = true; $id('login-err').textContent = '';
  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas');
    sessaoGuardar(data);                                   // v7.17.1
    entrar();
  } catch(e) { $id('login-err').textContent = e.message; }
  btn.disabled = false;
}

function toast(msg) {
  const t = $id('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ── PONTE PARA OS MÓDULOS ──────────────────────────────────────────────
   O `const APP` acima NÃO cria window.APP: const de topo de script vive no
   escopo de script, não no objeto global. No bundle embutido isso não
   importava, porque núcleo e módulo dividiam o mesmo bloco <script> e o nome
   resolvia por escopo léxico. Aqui são ARQUIVOS separados, e o módulo lê
   `window.APP.escritorioId` para saber de qual escritório é a gravação.
   Sem esta linha, o escritório fica nulo e TODO botão de banco responde
   "Sem sessão" — sem que nada esteja errado no banco.                     */
window.APP = APP;
window.supa = supa;
window.supaFn = supaFn;
window.toast = toast;

async function doLogout(){
  try { await fetch(SUPA_URL + '/auth/v1/logout', { method:'POST',
    headers:{ apikey:SUPA_KEY, authorization:'Bearer ' + (APP.token||'') } }); } catch(e){}
  try { localStorage.removeItem('atp_sessao'); } catch(e){}
  APP.token = null; APP.user = null;
  $id('app').style.display = 'none';
  $id('auth-screen').style.display = 'flex';
}

/* ── navegação: só duas telas ──────────────────────────────────────────── */
function go(p){
  const d = $id('modulo-destino'), m = $id('page-modulo');
  if (d) d.style.display = p === 'modulo' ? 'none' : 'block';
  if (m) m.style.display = p === 'modulo' ? 'block' : 'none';
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  if (p === 'modulo' && typeof modInfoPintar === 'function') modInfoPintar();
}

/* ── a ficha do módulo, lida do próprio manifesto ──────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function modInfoPintar(){
  const alvo = $id('mod-lista'); if (!alvo) return;
  const i = (window.ModulosInfo || {}).imobiliario;
  if (!i) { alvo.innerHTML = '<div class="card"><h2>Módulo não carregado</h2>' +
    '<div class="hint">Os arquivos de modulos/imobiliario/ não chegaram. ' +
    'Verifique o caminho no servidor.</div></div>'; return; }
  const motorVivo = (window.MotorImob && MotorImob.lacreCalcular && MotorImob.lacreCalcular()) || null;
  const bate = motorVivo && motorVivo === i.motor.lacre;
  let h = '<div class="card"><h2>' + esc(i.rotulo) +
    ' <span class="badge ok">v' + esc(i.versao) + '</span></h2><table><tbody>' +
    '<tr><td>Motor</td><td class="num">' + esc(i.motor.versao) + '</td><td>' +
      esc(i.motor.nome) + ' · ruleset <code>' + esc(i.motor.ruleset) + '</code></td></tr>' +
    '<tr><td>Lacre</td><td class="num"><code>' + esc(i.motor.lacre) + '</code></td><td>' +
      (bate ? 'confere com o motor carregado'
            : '<b>NÃO CONFERE</b> — o motor calculou <code>' + esc(motorVivo || '—') + '</code>') +
      '</td></tr>' +
    '<tr><td>Regras</td><td class="num">' + esc(i.motor.regras) + '</td><td>' +
      esc(i.motor.homologadas) + ' homologadas</td></tr>' +
    '<tr><td>Base legal</td><td class="num">' + esc(i.base_legal.dispositivos) + '</td><td>' +
      esc(i.base_legal.fontes.join(' · ')) + '</td></tr>' +
    '<tr><td>Estado</td><td class="num">—</td><td>' + esc(i.estado) + '</td></tr>' +
    '</tbody></table><div class="hint" style="margin-top:8px">⚠️ ' + esc(i.ressalva) + '</div></div>';
  h += '<div class="card"><h2>Histórico do módulo</h2><table><thead><tr>' +
    '<th style="width:80px">Versão</th><th style="width:110px">Data</th><th>Novidades</th>' +
    '</tr></thead><tbody>' + i.changelog.map(function(c,k){
      return '<tr><td><b>' + esc(c.versao) + '</b>' +
        (k===0 ? ' <span class="badge ok">atual</span>' : '') + '</td><td>' +
        esc(c.data) + '</td><td>' + esc(c.texto) + '</td></tr>'; }).join('') +
    '</tbody></table></div>';
  alvo.innerHTML = h;
}

/* ── entrada ───────────────────────────────────────────────────────────── */
async function entrar(){
  $id('auth-screen').style.display = 'none';
  $id('app').style.display = 'block';
  $id('user-email').textContent = (APP.user && APP.user.email) || '';
  // o mesmo contexto que a aba usa dentro do app completo
  try {
    const u = await supa('GET','atp_usuarios',{ params:{ select:'papel,escritorio_id',
      email: 'eq.' + ((APP.user && APP.user.email) || ''), limit:'1' } });
    APP.papel = (u && u[0] && u[0].papel) || 'operador';
    APP.escritorioId = (u && u[0] && u[0].escritorio_id) || null;
  } catch(e) { APP.papel = 'operador'; APP.escritorioId = null; }
  try { imobEntrar(); } catch(e){ console.warn('[imob]', e); }
  modInfoPintar();
}

(async () => {
  if (await tentarSessao()) entrar();
  else $id('auth-screen').style.display = 'flex';
})();

# Análise Tributária Pro — CI: roda a suíte a cada push/PR no index.html ou nos testes
name: Testes do motor
on:
  push:
    paths: ['index.html', 'tests/**']
  pull_request:
    paths: ['index.html', 'tests/**']
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Suíte completa (motor + parecer + gabaritos)
        run: node tests/run.js
